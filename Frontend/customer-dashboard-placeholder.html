<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CouponX - Customer Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-purple-600">CouponX</h1>
    <div class="flex items-center gap-4">
      <span id="welcomeMsg" class="text-gray-700 text-sm"></span>
      <button id="logoutBtn" class="bg-purple-600 text-white text-sm px-4 py-2 rounded-md hover:bg-purple-700">
        Logout
      </button>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto mt-8 px-6 text-center">
    <h2 class="text-2xl font-semibold mb-2">Welcome to CouponX!</h2>
    <p class="text-gray-500 text-sm mb-6">
      This is a sample static customer homepage. Shop, Categories, Deals, and Cart pages will be added in later steps.
    </p>
    <div class="bg-white p-8 rounded-lg shadow-md">
      <p class="text-gray-600">🛍️ Browse products, add them to your cart, and apply coupon codes at checkout.</p>
    </div>
  </div>
  <script src="js/customerDashboardPlaceholder.js"></script>
</body>
</html>
