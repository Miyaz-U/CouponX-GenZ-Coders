<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CouponX - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-purple-600 text-center mb-6">CouponX</h1>

    <div class="flex mb-6 border border-gray-300 rounded-lg overflow-hidden">
      <button id="customerTabBtn" type="button"
        class="w-1/2 py-2 text-sm font-medium bg-purple-600 text-white">
        Customer Login
      </button>
      <button id="adminTabBtn" type="button"
        class="w-1/2 py-2 text-sm font-medium bg-white text-gray-600">
        Admin Login
      </button>
    </div>

    <input type="hidden" id="selectedRole" value="customer" />

    <form id="loginForm">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" placeholder="********"
            class="w-full border border-gray-300 rounded-md px-3 py-2 pr-16 focus:outline-none focus:ring-2 focus:ring-purple-500" />
          <button type="button" id="togglePasswordBtn"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-purple-600 font-medium">
            Show
          </button>
        </div>
      </div>
      <p id="errorMsg" class="text-red-600 text-sm mb-4 hidden"></p>
      <button type="submit"
        class="w-full bg-purple-600 text-white font-medium py-2 rounded-md hover:bg-purple-700">
        Login
      </button>
      <p id="signupPrompt" class="text-center text-sm text-gray-500 mt-4">
        New to CouponX?
        <button type="button" id="showSignupBtn" class="text-purple-600 font-medium hover:underline">
          Create an account
        </button>
      </p>
    </form>

    <form id="signupForm" class="hidden">
      <div class="mb-4">
        <label for="signupName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input type="text" id="signupName" placeholder="Your name"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>
      <div class="mb-4">
        <label for="signupEmail" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>
      <div class="mb-4">
        <label for="signupPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="signupPassword" placeholder="********"
            class="w-full border border-gray-300 rounded-md px-3 py-2 pr-16 focus:outline-none focus:ring-2 focus:ring-purple-500" />
          <button type="button" id="toggleSignupPasswordBtn"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-purple-600 font-medium">
            Show
          </button>
        </div>
      </div>
      <div class="mb-4">
        <label for="signupConfirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        <div class="relative">
          <input type="password" id="signupConfirmPassword" placeholder="********"
            class="w-full border border-gray-300 rounded-md px-3 py-2 pr-16 focus:outline-none focus:ring-2 focus:ring-purple-500" />
          <button type="button" id="toggleSignupConfirmPasswordBtn"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-purple-600 font-medium">
            Show
          </button>
        </div>
      </div>
      <p id="signupErrorMsg" class="text-red-600 text-sm mb-4 hidden"></p>
      <p id="signupSuccessMsg" class="text-green-600 text-sm mb-4 hidden"></p>
      <button type="submit"
        class="w-full bg-purple-600 text-white font-medium py-2 rounded-md hover:bg-purple-700">
        Create Account
      </button>
      <p class="text-center text-sm text-gray-500 mt-4">
        Already have an account?
        <button type="button" id="showLoginBtn" class="text-purple-600 font-medium hover:underline">
          Log in
        </button>
      </p>
    </form>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
