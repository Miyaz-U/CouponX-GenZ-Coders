<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CouponX - Create Coupon</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
    class="bg-[#0b0b14]
           text-white
           min-h-screen">


    <!-- SIDEBAR -->

    <aside
        class="hidden lg:block
               fixed left-0 top-0
               w-64 h-screen
               bg-[#12121d]
               border-r border-white/10">

        <div class="p-6">

            <h1 class="text-2xl font-bold">

                Coupon<span class="text-purple-400">
                    X
                </span>

            </h1>

            <p class="text-xs text-gray-500">
                Admin Portal
            </p>

        </div>


        <nav class="px-4 space-y-2">

            <a href="/dashboard.html"
                class="block px-4 py-3
                       text-gray-400
                       rounded-xl
                       hover:bg-white/5">

                ▦ Dashboard

            </a>


            <a href="/coupons.html"
                class="block px-4 py-3
                       text-purple-400
                       bg-purple-600/10
                       rounded-xl">

                🎟 Coupons

            </a>


            <a href="/orders.html"
                class="block px-4 py-3
                       text-gray-400
                       rounded-xl
                       hover:bg-white/5">

                🛒 Orders

            </a>


            <a href="/customers.html"
                class="block px-4 py-3
                       text-gray-400
                       rounded-xl
                       hover:bg-white/5">

                👥 Customers

            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="lg:ml-64">


        <header
            class="h-20
                   border-b border-white/10
                   flex items-center
                   px-5 sm:px-8">

            <div>

                <h2 class="text-2xl font-bold">
                    Create Coupon
                </h2>

                <p class="text-gray-500 text-sm">
                    Add a new coupon
                </p>

            </div>

        </header>


        <section class="p-5 sm:p-8">


            <form
                id="couponForm"
                class="max-w-4xl">


                <div
                    class="bg-[#12121d]
                           border border-white/10
                           rounded-2xl
                           p-6 sm:p-8">


                    <!-- COUPON CODE -->

                    <div class="mb-6">

                        <label
                            class="block
                                   text-sm
                                   text-gray-400
                                   mb-2">

                            Coupon Code

                        </label>

                        <input
                            id="code"
                            required
                            type="text"
                            placeholder="SUMMER20"
                            class="w-full
                                   bg-[#0b0b14]
                                   border border-white/10
                                   rounded-xl
                                   px-4 py-3
                                   outline-none
                                   focus:border-purple-500
                                   uppercase">

                    </div>


                    <!-- DISCOUNT -->

                    <div
                        class="grid
                               grid-cols-1
                               md:grid-cols-2
                               gap-5">


                        <div>

                            <label
                                class="block
                                       text-sm
                                       text-gray-400
                                       mb-2">

                                Discount Type

                            </label>

                            <select
                                id="discountType"
                                class="w-full
                                       bg-[#0b0b14]
                                       border border-white/10
                                       rounded-xl
                                       px-4 py-3
                                       outline-none">

                                <option value="percentage">
                                    Percentage
                                </option>

                                <option value="fixed">
                                    Fixed Amount
                                </option>

                            </select>

                        </div>


                        <div>

                            <label
                                class="block
                                       text-sm
                                       text-gray-400
                                       mb-2">

                                Discount Value

                            </label>

                            <input
                                id="discountValue"
                                required
                                type="number"
                                placeholder="20"
                                class="w-full
                                       bg-[#0b0b14]
                                       border border-white/10
                                       rounded-xl
                                       px-4 py-3
                                       outline-none
                                       focus:border-purple-500">

                        </div>

                    </div>


                    <!-- PURCHASE -->

                    <div
                        class="grid
                               grid-cols-1
                               md:grid-cols-2
                               gap-5 mt-5">


                        <div>

                            <label
                                class="block
                                       text-sm
                                       text-gray-400
                                       mb-2">

                                Minimum Purchase

                            </label>

                            <input
                                id="minPurchase"
                                type="number"
                                value="0"
                                class="w-full
                                       bg-[#0b0b14]
                                       border border-white/10
                                       rounded-xl
                                       px-4 py-3
                                       outline-none">

                        </div>


                        <div>

                            <label
                                class="block
                                       text-sm
                                       text-gray-400
                                       mb-2">

                                Usage Limit

                            </label>

                            <input
                                id="usageLimit"
                                type="number"
                                value="100"
                                class="w-full
                                       bg-[#0b0b14]
                                       border border-white/10
                                       rounded-xl
                                       px-4 py-3
                                       outline-none">

                        </div>

                    </div>


                    <!-- DATES -->

                    <div
                        class="grid
                               grid-cols-1
                               md:grid-cols-2
                               gap-5 mt-5">


                        <div>

                            <label
                                class="block
                                       text-sm
                                       text-gray-400
                                       mb-2">

                                Valid From

                            </label>

                            <input
                                id="validFrom"
                                required
                                type="date"
                                class="w-full
                                       bg-[#0b0b14]
                                       border border-white/10
                                       rounded-xl
                                       px-4 py-3">

                        </div>


                        <div>

                            <label
                                class="block
                                       text-sm
                                       text-gray-400
                                       mb-2">

                                Valid Till

                            </label>

                            <input
                                id="validTill"
                                required
                                type="date"
                                class="w-full
                                       bg-[#0b0b14]
                                       border border-white/10
                                       rounded-xl
                                       px-4 py-3">

                        </div>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="mt-5">

                        <label
                            class="block
                                   text-sm
                                   text-gray-400
                                   mb-2">

                            Description

                        </label>

                        <textarea
                            id="description"
                            rows="4"
                            placeholder="20% off on minimum purchase of ₹1000"
                            class="w-full
                                   bg-[#0b0b14]
                                   border border-white/10
                                   rounded-xl
                                   px-4 py-3
                                   outline-none
                                   resize-none"></textarea>

                    </div>


                    <!-- ACTIVE -->

                    <label
                        class="flex items-center
                               gap-3 mt-6
                               cursor-pointer">

                        <input
                            id="isActive"
                            type="checkbox"
                            checked
                            class="w-5 h-5
                                   accent-purple-600">

                        <span>
                            Active Coupon
                        </span>

                    </label>


                    <!-- BUTTONS -->

                    <div
                        class="flex
                               flex-col-reverse
                               sm:flex-row
                               gap-3
                               justify-end
                               mt-8">


                        <a href="/coupons.html"
                            class="px-6 py-3
                                   rounded-xl
                                   bg-white/5
                                   text-center">

                            Cancel

                        </a>


                        <button
                            type="submit"
                            class="px-6 py-3
                                   rounded-xl
                                   bg-purple-600
                                   hover:bg-purple-700">

                            Create Coupon

                        </button>

                    </div>


                    <p
                        id="message"
                        class="text-sm
                               text-center
                               mt-5">
                    </p>

                </div>

            </form>

        </section>

    </main>


    <script src="/js/create-coupon.js"></script>

</body>

</html>
