<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>CouponX - Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16
                flex items-center justify-between">
        <!-- LOGO -->
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-lg
                        bg-violet-600 text-white
                        flex items-center justify-center
                        font-bold">X
            </div>
            <h1 class="text-xl font-bold">
                Coupon<span class="text-violet-600">X</span>
            </h1>
        </div>
        <!-- NAVIGATION -->
        <nav class="hidden md:flex gap-8 text-sm font-medium">
            <a href="#"
               class="text-gray-500 hover:text-violet-600">Home</a>
            <a href="#"class="text-gray-500 hover:text-violet-600">Shop</a>
            <a href="#"class="text-gray-500 hover:text-violet-600">Categories</a>
            <a href="#"class="text-violet-600 font-semiboldborder-b-2 border-violet-600pb-5">Deals</a>
        </nav>
        <!-- HEADER RIGHT -->
        <div class="flex items-center gap-3">
            <!-- SEARCH -->
            <button
                onclick="focusSearch()"
                class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200">🔍</button>
            <!-- CART -->
            <button
                onclick="openCart()"
                class="relative w-10 h-10 rounded-full
                       bg-gray-100 hover:bg-gray-200"> 🛒<span
                    id="cartCount"
                    class="absolute -top-1 -right-1
                           bg-pink-500 text-white
                           text-xs font-bold
                           rounded-full
                           min-w-[18px] h-[18px]
                           flex items-center justify-center">0 </span>

            </button>
            <!-- ACCOUNT -->
            <button class="w-10 h-10 rounded-fullbg-violet-600 text-white">👤</button>
        </div>
    </div>
</header>
<!-- ================= MAIN ================= -->
<main class="max-w-7xl mx-auto px-6 py-6">
    <!-- BREADCRUMB -->
    <div class="text-xs text-gray-400 mb-4">
        <a href="#" class="hover:text-violet-600">Home</a>
        <span class="mx-2">›</span>
        <span class="text-violet-600"> Deals  </span>

    </div>
    <!-- ================= HERO ================= -->

    <section
        class="bg-gradient-to-r
               from-red-500 to-pink-500
               rounded-2xl
               px-7 py-7
               flex flex-wrap
               items-center
               justify-between
               gap-6
               shadow-lg">
        <div>
            <h2
                class="text-white
                       font-bold
                       text-2xl md:text-3xl">

                🔥 Today's Deals
            </h2>
            <p
                class="text-white/90
                       text-sm mt-2">

                Limited-time offers on top products —
                grab them before they're gone.
            </p>
        </div>

        <!-- HERO TIMER -->
        <div class="flex gap-2">
            <div
                class="bg-white/20
                       rounded-lg
                       px-4 py-2
                       text-center text-white">
                <span
                    id="heroH"
                    class="block
                           font-bold
                           text-lg">
                    00
                </span>
                <small>HRS</small>
            </div>
            <div
                class="bg-white/20
                       rounded-lg
                       px-4 py-2
                       text-center text-white">
                <span
                    id="heroM"
                    class="block
                           font-bold
                           text-lg">
                    00
                </span>
                <small>MIN</small>
            </div>
            <div
                class="bg-white/20
                       rounded-lg
                       px-4 py-2
                       text-center text-white">

                <span
                    id="heroS"
                    class="block
                           font-bold
                           text-lg">

                    00

                </span>

                <small>SEC</small>

            </div>

        </div>

    </section>



    <!-- ================= SEARCH + FILTER ================= -->

    <div
        class="flex flex-col
               md:flex-row
               gap-4
               justify-between
               mt-6 mb-5">


        <!-- SEARCH -->

        <input
            id="searchInput"
            type="text"
            placeholder="Search products..."

            class="w-full md:w-80
                   bg-white
                   border border-gray-200
                   rounded-lg
                   px-4 py-2.5
                   text-sm
                   outline-none
                   focus:border-violet-500
                   focus:ring-2
                   focus:ring-violet-100">
        <!-- FILTER -->
        <div class="flex items-center gap-2">
            <label
                class="text-sm text-gray-500">
                Filter:
            </label>
            <select
                id="categoryFilter"

                class="bg-white
                       border border-gray-200
                       text-gray-800
                       text-sm
                       rounded-lg
                       px-4 py-2.5
                       outline-none
                       focus:border-violet-500">
                <option value="all">
                    🔥 Today's Deals (9)
                </option>
                <option value="laptop">
                    💻 Laptops (8)
                </option>
                <option value="mobile">
                    📱 Mobiles (8)
                </option>

                <option value="earbuds">
                    🎧 Earbuds (8)
                </option>
                <option value="watch">
                    ⌚ Smart Watches (8)
                </option>
                <option value="accessories">

                    🖱️ Accessories (8)
                </option>

                <option value="speaker">
                    🔊 Speakers (8)
                </option>
                <option value="other">
                    📷 Other Gadgets (8)
                </option>
            </select>
        </div>
    </div>
    <!-- STATUS -->
    <div
        id="statusRow"
        class="text-sm
               text-gray-500
               mb-4">

        Today's Deals — 9 products

    </div>
    <!-- ================= PRODUCTS ================= -->
    <div
        id="dealsGrid"

        class="grid
               grid-cols-1
               sm:grid-cols-2
               lg:grid-cols-4
               gap-5">

    </div>
</main>

<!-- ================= CART DRAWER ================= -->
<div
    id="cartOverlay"

    class="fixed inset-0
           bg-black/40
           hidden
           z-50">
    <!-- CART -->

    <div
        id="cartPanel"

        class="absolute
               right-0 top-0
               h-full
               w-full sm:w-[420px]
               bg-white
               shadow-2xl
               flex flex-col">
        <!-- CART HEADER -->

        <div
            class="flex items-center
                   justify-between
                   px-5 py-4
                   border-b">

            <h2
                class="font-bold
                       text-lg">

                🛒 Your Cart
            </h2>
            <button
                onclick="closeCart()"

                class="w-8 h-8
                       rounded-full
                       bg-gray-100
                       hover:bg-gray-200">

                ✕

            </button>
        </div>
        <!-- CART ITEMS -->

        <div
            id="cartItems"

            class="flex-1
                   overflow-y-auto
                   p-5">
        </div>
        <!-- CART FOOTER -->
        <div
            class="border-t
                   p-5">
            <div
                class="flex
                       justify-between
                       mb-4">

                <span
                    class="text-gray-500">
                    Subtotal
                </span>
                <span
                    id="cartSubtotal"
                    class="font-bold">
                    ₹0
                </span>
            </div>
            <button
                class="w-full
                       bg-violet-600
                       hover:bg-violet-700
                       text-white
                       py-3
                       rounded-xl
                       font-semibold">
                Proceed to Checkout
            </button>
        </div>
    </div>
</div>
<!-- JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
