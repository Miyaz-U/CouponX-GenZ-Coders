<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CouponX - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-purple-600">CouponX Admin</h1>
    <div class="flex items-center gap-4">
      <span id="welcomeMsg" class="text-gray-700 text-sm"></span>
      <button id="logoutBtn" class="bg-purple-600 text-white text-sm px-4 py-2 rounded-md hover:bg-purple-700">
        Logout
      </button>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto mt-8 px-6">
    <h2 class="text-2xl font-semibold mb-4">Dashboard Overview</h2>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-6 rounded-lg shadow-md text-center">
        <p class="text-gray-500 text-sm">Total Coupons</p>
        <p class="text-2xl font-bold text-purple-600">25</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-md text-center">
        <p class="text-gray-500 text-sm">Active Coupons</p>
        <p class="text-2xl font-bold text-green-600">18</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-md text-center">
        <p class="text-gray-500 text-sm">Expired Coupons</p>
        <p class="text-2xl font-bold text-red-600">7</p>
      </div>
    </div>

    <p class="text-gray-500 text-sm mt-6">
      This is a sample static dashboard page. Coupon management features will be added in a later step.
    </p>
  </div>
  <script src="js/adminDashboardPlaceholder.js"></script>
</body>
</html>
