<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CouponX — Tech Deals</title>

    <!-- TailwindCSS CDN: zero-build setup for this demo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
                    colors: {
                        brand: { 500: "#7c3aed", 600: "#6d28d9" }
                    },
                    boxShadow: {
                        soft: "0 6px 24px rgba(31, 41, 55, .06)"
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f6f5fb;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            object-position: center;
            display: block;
            padding: 15px;
        }

        .product-image:hover {
            transform: scale(1.05);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            scrollbar-width: none;
        }

        .hero-grid {
            background-image:
                radial-gradient(circle at 88% 20%, rgba(255, 255, 255, .16) 0 10%, transparent 10.2%),
                radial-gradient(circle at 92% 92%, rgba(255, 255, 255, .10) 0 8%, transparent 8.2%);
        }
    </style>
</head>

<body class="min-h-screen text-slate-800 font-sans">



    <header class="sticky top-0 z-40 border-b border-slate-200/70 bg-white/95 backdrop-blur">
        <div class="mx-auto flex h-14  items-center justify-between p-9">
            <a href="#" class="flex items-center  font-bold tracking-tight text-violet-700 gap-2 text-[20px]">
                <span class="grid h-7 w-7 place-items-center rounded-md bg-violet-600 text-[10px] text-white">X</span>
                CouponX
            </a>

            <nav class="hidden items-center gap-8 text-[17px] font-medium text-slate-500 md:flex">
                <a class="text-violet-600" href="#home">Home</a>
                <a href="#featured" class="hover:text-violet-600">Shop</a>
                <a href="#categories" class="hover:text-violet-600">Categories</a>
                <a href="#deals" class="hover:text-violet-600">Deals</a>
            </nav>

            <div class="flex items-center gap-2">
                <button aria-label="Search"
                    class="grid h-8 w-8 place-items-center rounded-lg bg-slate-50 text-slate-500 hover:bg-violet-50 hover:text-violet-600">
                    <i data-lucide="search" class="h-4 w-4"></i>
                </button>
                <button id="cartButton" aria-label="Cart"
                    class="relative grid h-8 w-8 place-items-center rounded-lg bg-slate-50 text-slate-500 hover:bg-violet-50 hover:text-violet-600">
                    <i data-lucide="shopping-cart" class="h-4 w-4"></i>
                    <span id="cartCount"
                        class="absolute -right-1 -top-1 hidden min-w-3.5 rounded-full bg-violet-600 px-1 text-center text-[8px] font-bold leading-3.5 text-white"></span>
                </button>
                <button aria-label="Account"
                    class="grid h-8 w-8 place-items-center rounded-lg bg-slate-50 text-slate-500 hover:bg-violet-50 hover:text-violet-600">
                    <i data-lucide="user-round" class="h-4 w-4"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="home" class="mx-auto max-w-7xl px-4 pb-10 pt-4 sm:px-6 lg:px-8">
        <!-- Hero -->
        <section
            class="hero-grid relative overflow-hidden rounded-xl bg-gradient-to-r from-violet-700 via-purple-600 to-fuchsia-400 px-6 py-6 text-white shadow-soft sm:px-8 sm:py-8">
            <div class="relative z-10 max-w-lg">
                <p class="mb-2 text-[8px] font-bold tracking-[.18em] text-violet-100">MEGA SAVINGS EVENT</p>
                <h1 class="max-w-md text-2xl font-bold leading-tight sm:text-3xl">Big savings on tech essentials, every
                    day.
                </h1>
                <p class="mt-2 max-w-md text-[10px] leading-relaxed text-violet-50 sm:text-[11px]">
                    Shop laptops, accessories &amp; more — apply a coupon at checkout and save instantly!
                </p>
                <a href="#deals"
                    class="mt-4 inline-flex rounded-md bg-white/15 px-4 py-2 text-[10px] font-semibold backdrop-blur transition hover:bg-white/25">
                    Shop Now
                </a>
            </div>

            <div class="pointer-events-none absolute right-4 top-1/2 hidden -translate-y-1/2 sm:block">
                <div class="relative h-28 w-36">
                    <div class="absolute right-0 top-1/2 h-14 w-24 -translate-y-1/2 rounded-xl bg-white/20"></div>
                    <div class="absolute right-8 top-8">
                        <i data-lucide="laptop" class="h-10 w-10 text-slate-800/80"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- Categories -->
        <section id="categories" class="mt-5">
            <div class="mb-2 flex items-center justify-between">
                <h2 class="text-xs font-bold text-slate-800 sm:text-sm">Shop by Category</h2>
                <button class="text-[9px] font-bold text-violet-600 hover:underline">View All →</button>
            </div>
            <div id="categoryGrid" class="grid grid-cols-3 gap-2 sm:grid-cols-6 sm:gap-3"></div>
        </section>

        <!-- Featured -->
        <section id="featured" class="mt-5">
            <div class="mb-2 flex items-center justify-between">
                <h2 class="text-xs font-bold text-slate-800 sm:text-sm">Featured Products</h2>
                <button class="text-[9px] font-bold text-violet-600 hover:underline">View All →</button>
            </div>
            <div id="featuredGrid" class="grid grid-cols-2 gap-2 sm:grid-cols-4 sm:gap-3"></div>
        </section>

        <!-- Deals -->
        <section id="deals" class="mt-5">
            <div class="mb-2 flex items-center justify-between">
                <h2 class="text-xs font-bold text-slate-800 sm:text-sm">Today's Deals</h2>
                <button class="text-[9px] font-semibold text-violet-600 hover:underline">View All →</button>
            </div>
            <div id="dealsGrid" class="grid grid-cols-1 gap-2 sm:grid-cols-3 sm:gap-3"></div>
        </section>
    </main>

    <!-- Cart drawer -->
    <aside id="cartDrawer"
        class="fixed inset-y-0 right-0 z-50 w-full max-w-sm translate-x-full border-l border-slate-200 bg-white shadow-2xl transition-transform duration-300">
        <div class="flex h-full flex-col">
            <div class="flex items-center justify-between border-b px-5 py-4">
                <div>
                    <h3 class="text-sm font-bold">Your Cart</h3>
                    <p id="cartSummary" class="mt-0.5 text-[10px] text-slate-400">0 items</p>
                </div>
                <button id="closeCart"
                    class="grid h-8 w-8 place-items-center rounded-lg bg-slate-100 hover:bg-slate-200">
                    <i data-lucide="x" class="h-4 w-4"></i>
                </button>
            </div>
            <div id="cartItems" class="flex-1 overflow-y-auto p-5"></div>
            <div class="border-t p-5">
                <div class="mb-3 flex items-center justify-between text-sm font-bold">
                    <span>Subtotal</span><span id="cartTotal">₹0</span>
                </div>
                <button
                    class="w-full rounded-lg bg-violet-600 py-2.5 text-xs font-semibold text-white hover:bg-violet-700">Checkout</button>
            </div>
        </div>
    </aside>
    <div id="cartBackdrop" class="fixed inset-0 z-40 hidden bg-slate-900/30 backdrop-blur-[1px]"></div>

    <div id="toast"
        class="pointer-events-none fixed bottom-4 left-1/2 z-[60] -translate-x-1/2 translate-y-5 rounded-lg bg-slate-900 px-4 py-2 text-xs font-medium text-white opacity-0 shadow-lg transition-all">
    </div>

    <script src="/app.js"></script>
</body>

</html>
<script src="./js/app.js"></script>
